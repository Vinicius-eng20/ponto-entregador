<div class="row g-2 align-items-end mb-4">
  <div class="col-6 col-sm-4 col-md-3">
    <label for="dash-mes" class="form-label">Mês</label>
    <select id="dash-mes" class="form-select">
      <option value="">Selecione...</option>
    </select>
  </div>
  <div class="col-6 col-sm-4 col-md-3">
    <label for="dash-semana" class="form-label">Semana</label>
    <select id="dash-semana" class="form-select" disabled>
      <option value="">Mês inteiro</option>
    </select>
  </div>
</div>

<p id="dash-vazio" class="text-muted">Selecione um mês para ver o dashboard.</p>

<div id="dash-conteudo" class="d-none">
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <p class="text-muted mb-1 small">Faturamento</p>
          <p class="h4 mb-0" id="dash-faturamento">—</p>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <p class="text-muted mb-1 small">Custos</p>
          <p class="h4 mb-0" id="dash-custos">—</p>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <p class="text-muted mb-1 small">Média de horas trabalhadas</p>
          <p class="h4 mb-0" id="dash-media-horas">—</p>
        </div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <p class="text-muted mb-1 small">Custos sobre ganhos</p>
          <p class="h4 mb-0" id="dash-percentual-custos">—</p>
        </div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <h3 class="h6 mb-3">Ganhos diários no período</h3>
      <canvas id="dash-grafico-ganhos" height="110"></canvas>
    </div>
  </div>
</div>
