<div class="card shadow-sm mb-5">
  <div class="card-body text-center py-4">
    <div class="d-flex justify-content-center align-items-center mb-3 position-relative">
      <h2 class="h4 mb-0" id="ponto-data-atual" data-date="{{ today.isoformat() }}">
        {{ today.strftime("%d/%m/%Y") }}
      </h2>
      <button
        type="button"
        class="btn btn-outline-secondary btn-sm rounded-circle position-absolute end-0"
        style="width: 2.2rem; height: 2.2rem;"
        data-bs-toggle="modal"
        data-bs-target="#modalAddRecord"
        title="Adicionar registro de outra data"
      >
        +
      </button>
    </div>

    <div id="ponto-idle" class="d-none">
      <button type="button" id="btn-entrada" class="btn btn-success btn-lg px-5">
        Registrar entrada
      </button>
    </div>

    <div id="ponto-working" class="d-none">
      <p class="text-muted mb-2">
        Entrada registrada às <strong id="ponto-hora-entrada"></strong>
      </p>
      <button type="button" id="btn-saida" class="btn btn-danger btn-lg px-5">
        Registrar saída
      </button>
    </div>

    <div id="ponto-awaiting-totals" class="d-none">
      <p class="text-muted mb-3">
        Turno de <strong id="ponto-hora-entrada-2"></strong> às
        <strong id="ponto-hora-saida"></strong>. Informe os ganhos e custos do dia:
      </p>
      <form id="form-totais" class="row justify-content-center g-2">
        <div class="col-12 col-sm-4">
          <label class="form-label" for="totais-ganhos">Ganhos (R$)</label>
          <input
            type="number"
            step="0.01"
            min="0"
            class="form-control"
            id="totais-ganhos"
            name="earnings"
            required
          />
        </div>
        <div class="col-12 col-sm-4">
          <label class="form-label" for="totais-custos">Custos (R$)</label>
          <input
            type="number"
            step="0.01"
            min="0"
            class="form-control"
            id="totais-custos"
            name="costs"
            required
          />
        </div>
        <div class="col-12 col-sm-3 d-flex align-items-end">
          <button type="submit" class="btn btn-primary w-100">Salvar</button>
        </div>
      </form>
    </div>

    <div id="ponto-erro" class="alert alert-danger mt-3 d-none" role="alert"></div>
  </div>
</div>

{% include "partials/add_record_modal.html" %}
