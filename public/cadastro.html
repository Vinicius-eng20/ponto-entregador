<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar conta | Ponto do Entregador</title>
    <link rel="icon" href="/img/icone.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/base.css" rel="stylesheet" />
  </head>
  <body>
    <main class="tela-acesso">
      <div class="cartao-acesso">
        <a class="marca" href="/"><span class="marca-placa" aria-hidden="true">P</span>Ponto do Entregador</a>
        <h1>Criar conta</h1>
        <p class="apoio">Leva menos de um minuto. Depois é só bater o ponto.</p>

        <form data-acesso="cadastro" novalidate>
          <div class="mb-3">
            <label class="form-label" for="name">Nome</label>
            <input class="form-control" id="name" name="name" autocomplete="name" maxlength="100" required autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" maxlength="255" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Senha</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="72" required aria-describedby="dica-senha" />
            <div class="form-text" id="dica-senha">Pelo menos 6 caracteres.</div>
          </div>
          <div class="mb-2">
            <label class="form-label" for="password_confirm">Confirme a senha</label>
            <input class="form-control" id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" required />
          </div>
          <p class="erro-formulario" role="alert"></p>
          <button class="btn btn-faixa w-100" type="submit">Criar conta</button>
        </form>

        <p class="mt-4 mb-0 text-center">Já tem conta? <a href="/login">Entrar</a></p>
      </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/acesso.js"></script>
  </body>
</html>
