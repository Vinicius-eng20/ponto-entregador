<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar | Ponto do Entregador</title>
    <link rel="icon" href="/img/icone.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="/css/base.css" rel="stylesheet" />
  </head>
  <body>
    <main class="tela-acesso">
      <div class="cartao-acesso">
        <a class="marca" href="/"><span class="marca-placa" aria-hidden="true">P</span>Ponto do Entregador</a>
        <h1>Entrar</h1>
        <p class="apoio">Acesse seu ponto, seus registros e seu dashboard.</p>

        <form data-acesso="login" novalidate>
          <div class="mb-3">
            <label class="form-label" for="email">E-mail</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="email" required autofocus />
          </div>
          <div class="mb-2">
            <label class="form-label" for="password">Senha</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required />
          </div>
          <p class="erro-formulario" role="alert"></p>
          <button class="btn btn-faixa w-100" type="submit">Entrar</button>
        </form>

        <p class="mt-4 mb-0 text-center">Ainda não tem conta? <a href="/cadastro">Criar conta</a></p>
      </div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/acesso.js"></script>
  </body>
</html>
