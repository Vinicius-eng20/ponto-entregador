services:
  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ponto_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ponto_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      FLASK_ENV: testing
      DATABASE_URL: postgresql://postgres:postgres@db_test:5432/ponto_test
      SECRET_KEY: test-secret-key
    volumes:
      - .:/app
    depends_on:
      db_test:
        condition: service_healthy
    command: ["pytest", "--cov=app", "--cov-report=term-missing"]
